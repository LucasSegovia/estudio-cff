<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <meta name="theme-color" content="#1E2847">
  <link rel="icon" type="image/svg+xml" href="static/marca/cff/logo-box.svg">
  <link rel="apple-touch-icon" href="static/marca/cff/icono-apple-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CFF">
  <title>Subir factura · Estudio CFF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/estilos.css?v=1792167796">
  <style>:root { --azul: #1E2847; }</style>
</head>
<body><div style="background:#FFF4D6;color:#6B4A00;font:700 15px/1.4 Manrope,system-ui,sans-serif;text-align:center;padding:10px 16px;border-bottom:1px solid #E9D49A">Demostración con datos de ejemplo · <a href="../" style="color:#6B4A00">Volver a la web</a></div>
  
<main class="pantalla">
  <div class="encabezado-pantalla">
    
  <a class="boton-volver" href="inicio.html" aria-label="Volver al inicio">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
  </a>

    <h1>Subir factura</h1>
  </div>

  <p class="explicacion">Sacale una foto a la factura o al ticket. Que se vea entero, derecho y con buena luz.</p>

  

  <form id="form-subir" method="get" action="subida.html" class="accesos">
    <label class="acceso acceso-principal acceso-alto" for="foto-camara">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
      Sacar una foto
    </label>
    <input class="oculto" id="foto-camara" type="file" accept="image/*" capture="environment">

    <label class="acceso" for="foto-archivo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>
      Elegir una foto o PDF
    </label>
    <input class="oculto" id="foto-archivo" type="file" accept="image/*,application/pdf">

    <noscript><button class="boton-grande" type="submit">Enviar</button></noscript>
  </form>

  <div class="subiendo" id="subiendo" role="status" hidden>
    <div class="ruedita" aria-hidden="true"></div>
    <p>Subiendo la factura…<br>No cierres esta pantalla.</p>
  </div>

  <script>
    // Apenas elige la foto, se manda (una acción por pantalla). Se manda solo el campo que usó.
    const form = document.getElementById("form-subir");
    for (const campo of form.querySelectorAll("input[type=file]")) {
      campo.addEventListener("change", () => {
        if (!campo.files.length) return;
        for (const otro of form.querySelectorAll("input[type=file]")) if (otro !== campo) otro.disabled = true;
        document.getElementById("subiendo").hidden = false;
        form.hidden = true;
        form.submit();
      });
    }
    // Si vuelve con el botón "atrás", que pueda elegir de nuevo.
    window.addEventListener("pageshow", () => {
      form.hidden = false;
      document.getElementById("subiendo").hidden = true;
      for (const campo of form.querySelectorAll("input[type=file]")) { campo.disabled = false; campo.value = ""; }
    });
  </script>
</main>

  <script src="static/formularios.js?v=1792167796" defer></script>
</body>
</html>
